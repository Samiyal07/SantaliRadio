<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📻 Santali Retro Radio</title>
  <style>
    :root {
      --bg: #141210;
      --card-bg: #221d19;
      --accent: #f59e0b;
      --text: #f5f5f4;
      --text-dim: #a8a29e;
      --border: #44382e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .radio-card {
      background: var(--card-bg);
      border: 3px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      text-align: center;
    }

    .brand {
      color: var(--accent);
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .sub-brand {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 20px;
    }

    .display-screen {
      background: #0f0d0b;
      border: 2px solid #2f2720;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .status {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .song-title {
      font-size: 1.05rem;
      font-weight: 600;
      min-height: 2.8em;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    .artist-name {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* Animated Retro Visualizer Bars */
    .visualizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 4px;
      height: 24px;
      margin-top: 14px;
    }

    .bar {
      width: 4px;
      background: var(--accent);
      border-radius: 2px;
      height: 4px;
      transition: height 0.2s;
    }

    .playing .bar {
      animation: pulse 0.8s infinite alternate ease-in-out;
    }

    .playing .bar:nth-child(2) { animation-delay: 0.2s; }
    .playing .bar:nth-child(3) { animation-delay: 0.4s; }
    .playing .bar:nth-child(4) { animation-delay: 0.1s; }
    .playing .bar:nth-child(5) { animation-delay: 0.3s; }

    @keyframes pulse {
      0% { height: 4px; }
      100% { height: 22px; }
    }

    audio { width: 100%; margin-bottom: 16px; }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .btn {
      background: #2f2720;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      flex: 1;
      transition: all 0.2s;
    }

    .btn:hover { background: #44382e; border-color: var(--accent); }
    .btn-active { background: var(--accent); color: #000; }

    .playlist-toggle {
      background: transparent;
      border: none;
      color: var(--accent);
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
    }

    /* Playlist Drawer */
    .drawer {
      display: none;
      margin-top: 16px;
      max-height: 200px;
      overflow-y: auto;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      text-align: left;
    }

    .track-row {
      padding: 8px;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-row:hover { background: #2f2720; color: var(--accent); }
    .track-row.active { color: var(--accent); font-weight: bold; }
  </style>
</head>
<body>

  <div class="radio-card">
    <div class="brand">📻 Santali Retro</div>
    <div class="sub-brand">Classic Nostalgia Engine</div>

    <div class="display-screen">
      <div class="status" id="status">Booting Radio...</div>
      <div class="song-title" id="song-title">Loading Playlist...</div>
      <div class="artist-name" id="artist-name">Santali Audio Collection</div>

      <div class="visualizer" id="visualizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>

    <audio id="audio-player" controls></audio>

    <div class="controls">
      <button class="btn" onclick="prevTrack()">⏮</button>
      <button class="btn" id="shuffle-btn" onclick="toggleShuffle()">🔀</button>
      <button class="btn" onclick="nextTrack()">⏭</button>
    </div>

    <button class="playlist-toggle" onclick="toggleDrawer()">📜 View Full Playlist</button>
    <div class="drawer" id="drawer"></div>
  </div>

  <script>
    // YOUR YOUTUBE MUSIC PLAYLIST ID HERE
    const PLAYLIST_ID = 'PL_FLdyax7a1GZg8a04byPupnG9XNl_Mug';

    let playlistTracks = [];
    let currentIndex = 0;
    let isShuffle = false;
    let prefetchedNext = { index: -1, streamUrl: null };

    const statusEl = document.getElementById('status');
    const titleEl = document.getElementById('song-title');
    const artistEl = document.getElementById('artist-name');
    const player = document.getElementById('audio-player');
    const visualizer = document.getElementById('visualizer');
    const drawer = document.getElementById('drawer');
    const shuffleBtn = document.getElementById('shuffle-btn');

    // 1. Fetch Playlist Tracks on Load
    async function initRadio() {
      statusEl.textContent = 'Fetching Playlist';
      try {
        const res = await fetch(`/api/playlist?id=${PLAYLIST_ID}`);
        const data = await res.json();

        if (data.tracks && data.tracks.length > 0) {
          playlistTracks = data.tracks;
          statusEl.textContent = 'Radio Ready';
          renderDrawer();
          loadAndPlay(0);
        } else {
          statusEl.textContent = 'Error';
          titleEl.textContent = 'Playlist is empty.';
        }
      } catch (err) {
        statusEl.textContent = 'Network Error';
        titleEl.textContent = 'Failed to load playlist.';
      }
    }

    // 2. Play Track with Background Prefetching
    async function loadAndPlay(index) {
      if (index < 0 || index >= playlistTracks.length) return;

      currentIndex = index;
      const track = playlistTracks[currentIndex];

      titleEl.textContent = track.title;
      artistEl.textContent = track.artist;
      highlightActiveTrack();

      // Check if this track was already pre-fetched
      if (prefetchedNext.index === index && prefetchedNext.streamUrl) {
        statusEl.textContent = 'Now Playing';
        player.src = prefetchedNext.streamUrl;
        player.play();
        prefetchNextTrack(); // Prefetch upcoming song!
        return;
      }

      statusEl.textContent = 'Extracting Audio...';

      try {
        const res = await fetch(`/api/extract?id=${track.id}`);
        const data = await res.json();

        if (data.streamUrl) {
          statusEl.textContent = 'Now Playing';
          player.src = data.streamUrl;
          player.play();

          // Prefetch NEXT song in background for 0-second buffering
          prefetchNextTrack();
        } else {
          throw new Error('Extraction failed');
        }
      } catch (err) {
        statusEl.textContent = 'Skipping...';
        setTimeout(nextTrack, 800);
      }
    }

    // Background Prefetcher for Next Song
    async function prefetchNextTrack() {
      const nextIndex = (currentIndex + 1) % playlistTracks.length;
      const nextTrackObj = playlistTracks[nextIndex];

      try {
        const res = await fetch(`/api/extract?id=${nextTrackObj.id}`);
        const data = await res.json();
        if (data.streamUrl) {
          prefetchedNext = { index: nextIndex, streamUrl: data.streamUrl };
        }
      } catch (e) {
        // Silent fail for prefetch
      }
    }

    function nextTrack() {
      if (isShuffle) {
        currentIndex = Math.floor(Math.random() * playlistTracks.length);
      } else {
        currentIndex = (currentIndex + 1) % playlistTracks.length;
      }
      loadAndPlay(currentIndex);
    }

    function prevTrack() {
      currentIndex = (currentIndex - 1 + playlistTracks.length) % playlistTracks.length;
      loadAndPlay(currentIndex);
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle('btn-active', isShuffle);
    }

    function toggleDrawer() {
      drawer.style.display = drawer.style.display === 'block' ? 'none' : 'block';
    }

    function renderDrawer() {
      drawer.innerHTML = '';
      playlistTracks.forEach((track, i) => {
        const row = document.createElement('div');
        row.className = `track-row ${i === currentIndex ? 'active' : ''}`;
        row.textContent = `${i + 1}. ${track.title}`;
        row.onclick = () => loadAndPlay(i);
        drawer.appendChild(row);
      });
    }

    function highlightActiveTrack() {
      const rows = drawer.querySelectorAll('.track-row');
      rows.forEach((r, i) => r.classList.toggle('active', i === currentIndex));
    }

    // Visualizer Animations
    player.onplay = () => visualizer.classList.add('playing');
    player.onpause = () => visualizer.classList.remove('playing');
    player.onended = nextTrack;

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        player.paused ? player.play() : player.pause();
      } else if (e.code === 'ArrowRight') {
        nextTrack();
      } else if (e.code === 'ArrowLeft') {
        prevTrack();
      }
    });

    // Initialize
    initRadio();
  </script>
</body>
</html>
