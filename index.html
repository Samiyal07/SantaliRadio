<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📻 Santali Retro Radio</title>
  <style>
    :root {
      --bg: #141210;
      --card-bg: #221d19;
      --accent: #f59e0b;
      --text: #f5f5f4;
      --text-dim: #a8a29e;
      --border: #44382e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .radio-card {
      background: var(--card-bg);
      border: 3px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      text-align: center;
    }

    .brand {
      color: var(--accent);
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .sub-brand {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 20px;
    }

    .display-screen {
      background: #0f0d0b;
      border: 2px solid #2f2720;
      border-radius: 12px;
      padding: 20px 16px;
      margin-bottom: 20px;
    }

    .status {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .song-title {
      font-size: 1.05rem;
      font-weight: 600;
      min-height: 2.8em;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      line-height: 1.4;
    }

    .artist-name {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-top: 6px;
    }

    .visualizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 4px;
      height: 24px;
      margin-top: 14px;
    }

    .bar {
      width: 4px;
      background: var(--accent);
      border-radius: 2px;
      height: 4px;
      transition: height 0.2s;
    }

    .playing .bar {
      animation: pulse 0.8s infinite alternate ease-in-out;
    }

    .playing .bar:nth-child(2) { animation-delay: 0.2s; }
    .playing .bar:nth-child(3) { animation-delay: 0.4s; }
    .playing .bar:nth-child(4) { animation-delay: 0.1s; }
    .playing .bar:nth-child(5) { animation-delay: 0.3s; }

    @keyframes pulse {
      0% { height: 4px; }
      100% { height: 22px; }
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn {
      background: #2f2720;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 1.1rem;
      flex: 1;
      transition: all 0.2s;
    }

    .btn:hover { background: #44382e; border-color: var(--accent); }
    .btn-play { background: var(--accent); color: #000; border: none; }
    .btn-play:hover { background: #d97706; }

    .engine-wrapper {
      margin-top: 15px;
      border-radius: 8px;
      overflow: hidden;
      opacity: 0.3;
      transition: opacity 0.3s;
    }
    .engine-wrapper:hover { opacity: 1; }
  </style>
</head>
<body>

  <div class="radio-card">
    <div class="brand">📻 Jharna Radio</div>
    <div class="sub-brand">Classic Santali Music</div>

    <div class="display-screen">
      <div class="status" id="status">Loading Engine...</div>
      <div class="song-title" id="song-title">Santali Retro Radio</div>
      <div class="artist-name" id="artist-name">Click ▶ PLAY to start</div>

      <div class="visualizer" id="visualizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" onclick="prevTrack()">⏮</button>
      <button class="btn btn-play" id="play-btn" onclick="togglePlay()">▶ PLAY</button>
      <button class="btn" onclick="nextTrack()">⏭</button>
    </div>

    <div class="engine-wrapper">
      <div id="youtube-player"></div>
    </div>
  </div>

  <script>
    // 📍 REPLACE WITH A VALID PUBLIC YOUTUBE PLAYLIST ID
    const PLAYLIST_ID = 'PL_FLdyax7a1GZg8a04byPupnG9XNl_Mug';

    let player = null;
    let isPlaying = false;

    const statusEl = document.getElementById('status');
    const titleEl = document.getElementById('song-title');
    const artistEl = document.getElementById('artist-name');
    const playBtn = document.getElementById('play-btn');
    const visualizer = document.getElementById('visualizer');

    // 1. Load API Script
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        height: '180',
        width: '100%',
        host: 'https://www.youtube.com',
        playerVars: {
          autoplay: 0,
          controls: 1,
          enablejsapi: 1,
          rel: 0
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }

    function onPlayerReady(event) {
      statusEl.textContent = 'Radio Ready';
      
      // Load playlist via IFrame API
      try {
        event.target.cuePlaylist({
          listType: 'playlist',
          list: PLAYLIST_ID,
          index: 0,
          startSeconds: 0
        });
      } catch(e) {
        console.error('Playlist cue failed:', e);
      }
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playBtn.textContent = '⏸ PAUSE';
        statusEl.textContent = 'Now Playing';
        visualizer.classList.add('playing');
        updateMetadata();
      } else if (event.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        playBtn.textContent = '▶ PLAY';
        statusEl.textContent = 'Paused';
        visualizer.classList.remove('playing');
      } else if (event.data === YT.PlayerState.BUFFERING) {
        statusEl.textContent = 'Buffering...';
      } else if (event.data === YT.PlayerState.CUED) {
        statusEl.textContent = 'Click ▶ PLAY';
        updateMetadata();
      }
    }

    function onPlayerError(event) {
      console.warn('Playback error (Code: ' + event.data + '). Auto-skipping...');
      if (event.data === 2) {
        statusEl.textContent = 'Invalid Playlist ID!';
      } else {
        statusEl.textContent = 'Skipping track...';
        setTimeout(() => nextTrack(), 600);
      }
    }

    function updateMetadata() {
      try {
        if (player && typeof player.getVideoData === 'function') {
          const data = player.getVideoData();
          if (data && data.title) {
            titleEl.textContent = data.title;
            artistEl.textContent = data.author || 'Santali Artist';
          }
        }
      } catch (e) {}
    }

    function togglePlay() {
      if (!player) return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    function nextTrack() {
      if (player && typeof player.nextVideo === 'function') {
        statusEl.textContent = 'Loading Next...';
        player.nextVideo();
      }
    }

    function prevTrack() {
      if (player && typeof player.previousVideo === 'function') {
        statusEl.textContent = 'Loading Prev...';
        player.previousVideo();
      }
    }
  </script>
</body>
</html>
